name: solar_sales
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  shared_preferences: ^2.5.5
  file_picker: ^10.3.3
  pdf: ^3.12.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  flutter_riverpod: ^2.6.1
  dio: ^5.9.2
  url_launcher: ^6.3.2
  permission_handler: ^12.0.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpeg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpeg