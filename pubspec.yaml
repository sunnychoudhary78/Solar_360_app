name: solar_sales
description: Solar 360 mobile app — Billbook + Green Energy.
publish_to: "none"

version: 1.0.0+7

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.2.1
  dio: ^5.9.1
  http_parser: ^4.1.2
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  google_fonts: ^8.0.1
  flutter_animate: ^4.5.2
  fl_chart: ^1.1.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  url_launcher: ^6.3.2
  share_plus: ^11.0.0
  image_picker: ^1.1.2
  image_picker_android: ^0.8.13
  file_picker: ^10.3.3
  pdf: ^3.12.0
  permission_handler: ^12.0.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/solar_header.png
    - assets/images/billbook_header.png
    - assets/logo/logo.png
    - assets/icon/icon.png
